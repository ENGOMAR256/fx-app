<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding-bottom: 20px; }
        
        .header { background: #141414; padding: 20px; text-align: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #FFD700; }
        
        .status-bar { background: rgba(0, 200, 83, 0.1); border: 1px solid rgba(0, 200, 83, 0.3); padding: 10px; text-align: center; color: #00C853; font-size: 13px; margin: 15px; border-radius: 8px; }
        
        .card { background: #141414; border: 1px solid #333; border-radius: 12px; margin: 15px; padding: 15px; position: relative; overflow: hidden; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .pair { font-size: 22px; font-weight: 900; color: #FFD700; }
        .badge { padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; }
        .buy { background: #00C853; color: #000; }
        .sell { background: #FF1744; color: #fff; }
        
        .timer-bar { height: 4px; background: #333; border-radius: 2px; margin-bottom: 15px; overflow: hidden; }
        .timer-fill { height: 100%; background: #FFD700; width: 100%; transition: width 1s linear; }
        .timer-text { font-size: 11px; color: #888; text-align: right; margin-top: -12px; margin-bottom: 10px; }
        
        .tf-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .tf-box { background: #0a0a0a; padding: 10px; border-radius: 8px; text-align: center; }
        .tf-name { font-size: 10px; color: #666; margin-bottom: 4px; }
        .tf-dir { font-size: 14px; font-weight: 800; }
        .tf-dir.buy { color: #00C853; }
        .tf-dir.sell { color: #FF1744; }
        .tf-dir.neutral { color: #666; }
        
        .prices { display: flex; justify-content: space-between; background: #0a0a0a; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .price-col { text-align: center; flex: 1; }
        .price-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .price-val { font-size: 14px; font-weight: 700; margin-top: 4px; }
        
        .tv-btn { display: block; width: 100%; background: #1DA1F2; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; }
        
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">FX PRO</div></div>
    <div id="status" class="status-bar">⏳ Scanning 15 Markets...</div>
    <div id="container"><div class="loading">Loading AI Engine...</div></div>

    <script>
        const tvMap = {
            'XAUUSD': 'OANDA:XAUUSD', 'EURUSD': 'OANDA:EURUSD', 'GBPUSD': 'OANDA:GBPUSD',
            'USDJPY': 'OANDA:USDJPY', 'BTCUSD': 'BINANCE:BTCUSDT', 'NAS100': 'NASDAQ:NDX',
            'US30': 'DJ:DJI', 'USOIL': 'TVC:USOIL'
        };

        async function fetchSignals() {
            try {
                // ⚠️ REPLACE WITH YOUR ACTUAL RENDER URL
                const res = await fetch('https://fx-app-2.onrender.com/signals'); 
                const signals = await res.json();
                renderSignals(signals);
            } catch (e) {
                document.getElementById('status').innerHTML = '❌ Backend Disconnected';
            }
        }

        function renderSignals(signals) {
            const container = document.getElementById('container');
            const status = document.getElementById('status');
            
            if (!signals || signals.length === 0) {
                status.innerHTML = '⏳ No high-confluence setups right now.';
                container.innerHTML = '<div class="loading">AI is scanning 15 markets across 3 timeframes...</div>';
                return;
            }
            
            status.innerHTML = `✅ ${signals.length} Active Setups Found`;
            let html = '';
            
            signals.forEach((s, index) => {
                const isBuy = s.main_direction === 'BUY';
                const tvSymbol = tvMap[s.pair] || s.pair;
                
                // Build Timeframe Matrix
                let tfHtml = '';
                ['M15', 'H1', 'H4'].forEach(tf => {
                    const setup = s.setups.find(x => x.timeframe === tf);
                    let dir = '—', dirClass = 'neutral', rsi = '';
                    if (setup) {
                        dir = setup.direction;
                        dirClass = setup.direction.toLowerCase();
                        rsi = `RSI:${setup.rsi}`;
                    }
                    tfHtml += `<div class="tf-box"><div class="tf-name">${tf}</div><div class="tf-dir ${dirClass}">${dir}</div><div class="tf-name">${rsi}</div></div>`;
                });

                html += `
                    <div class="card" id="card-${index}">
                        <div class="card-header">
                            <div class="pair">${s.pair}</div>
                            <div class="badge ${isBuy ? 'buy' : 'sell'}">${s.main_direction}</div>
                        </div>
                        
                        <div class="timer-bar"><div class="timer-fill" id="fill-${index}"></div></div>
                        <div class="timer-text">Expires in <span id="time-${index}">15:00</span></div>
                        
                        <div class="tf-matrix">${tfHtml}</div>
                        
                        <div class="prices">
                            <div class="price-col"><div class="price-label">Entry</div><div class="price-val" style="color:#FFD700">${s.entry}</div></div>
                            <div class="price-col"><div class="price-label">Stop Loss</div><div class="price-val" style="color:#FF1744">${s.stopLoss}</div></div>
                            <div class="price-col"><div class="price-label">Take Profit</div><div class="price-val" style="color:#00C853">${s.takeProfit}</div></div>
                        </div>
                        
                        <a href="https://www.tradingview.com/chart/?symbol=${tvSymbol}" target="_blank" class="tv-btn">📊 View Live Chart</a>
                    </div>
                `;
            });
            container.innerHTML = html;
            startTimers(signals);
        }

        function startTimers(signals) {
            signals.forEach((s, index) => {
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + 15); // 15 min timer
                
                const interval = setInterval(() => {
                    const now = new Date();
                    const diff = expiresAt - now;
                    
                    if (diff <= 0) {
                        clearInterval(interval);
                        const card = document.getElementById(`card-${index}`);
                        if (card) card.style.opacity = '0.2'; // Fade out expired signals
                        document.getElementById(`time-${index}`).innerText = "EXPIRED";
                        document.getElementById(`fill-${index}`).style.width = "0%";
                        return;
                    }
                    
                    const mins = Math.floor(diff / 60000);
                    const secs = Math.floor((diff % 60000) / 1000);
                    document.getElementById(`time-${index}`).innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                    document.getElementById(`fill-${index}`).style.width = `${(diff / 900000) * 100}%`;
                }, 1000);
            });
        }

        fetchSignals();
        setInterval(fetchSignals, 60000); // Refresh data every minute
    </script>
</body>
</html>
