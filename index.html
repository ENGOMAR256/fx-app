<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05080f">
    <title>FX PRO</title>
    <style>
        /* --- BASE & RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-main: #05080f;
            --bg-card: #111625;
            --bg-element: #1a2035;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --gold: #d4a843;
            --gold-glow: rgba(212, 168, 67, 0.2);
            --green: #10b981;
            --green-bg: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.15);
            --blue: #3b82f6;
            --blue-bg: rgba(59, 130, 246, 0.15);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* --- STICKY HEADER --- */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5, 8, 15, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); padding: 15px 20px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: 20px; font-weight: 900; color: var(--gold); letter-spacing: 1px; }
        .live-indicator {
            display: flex; align-items: center; gap: 6px;
            background: var(--green-bg); border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; color: var(--green);
        }
        .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .header-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        .clock-time { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .clock-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .total-signals { font-size: 12px; color: var(--gold); font-weight: 600; }

        /* --- FILTER PILLS --- */
        .filter-scroll {
            display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-pill {
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-muted); padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer;
        }
        .filter-pill.active { background: var(--gold-glow); border-color: var(--gold); color: var(--gold); }

        /* --- GROUPED SIGNAL CARDS --- */
        .card-container { padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .pair-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .card-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid var(--border); 
        }
        .pair-name { font-size: 22px; font-weight: 800; color: var(--text-main); }
        .setups-count { 
            background: var(--bg-element); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--gold); 
        }

        /* Individual Setup Block inside the Card */
        .setup-block {
            background: var(--bg-element); border-radius: 10px; padding: 12px; margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .setup-block:last-child { margin-bottom: 0; }

        .setup-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tf-badge { 
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; color: var(--text-main); 
        }
        .dir-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
        .dir-badge.buy { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .dir-badge.sell { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .status-badge { font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
        .status-badge.active { color: var(--green); }
        .status-badge.pending { color: var(--blue); }

        .strat-text { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }

        /* 3-Column Price Grid */
        .price-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .price-cell { background: var(--bg-card); border-radius: 6px; padding: 8px 4px; text-align: center; }
        .price-label { font-size: 8px; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; margin-bottom: 3px; }
        .price-val { font-size: 13px; font-weight: 700; font-family: 'Courier New', monospace; }
        .price-val.entry { color: var(--gold); }
        .price-val.stop { color: var(--red); }
        .price-val.tp { color: var(--green); }

        /* Timer Bar */
        .timer-section { display: flex; align-items: center; gap: 8px; }
        .timer-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .timer-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 1s linear; }
        .timer-text { font-size: 10px; color: var(--text-muted); font-weight: 600; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(17, 22, 37, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 100;
        }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; }
        .nav-btn.active { color: var(--gold); }
        .nav-icon { font-size: 20px; }

        /* --- EMPTY STATE --- */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 40px; margin-bottom: 15px; opacity: 0.5; }
        .loading { text-align: center; padding: 60px 20px; color: var(--gold); }
        .spinner {
            width: 30px; height: 30px; border: 3px solid var(--border); border-top: 3px solid var(--gold);
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Sticky Header -->
    <header class="app-header">
        <div class="header-top">
            <div class="logo">FX PRO</div>
            <div class="live-indicator"><div class="live-dot"></div> LIVE FEED</div>
        </div>
        <div class="header-bottom">
            <div>
                <div class="clock-time" id="clock">00:00:00</div>
                <div class="clock-date" id="dateLabel">Loading...</div>
            </div>
            <div class="total-signals" id="totalSignals">0 PAIRS</div>
        </div>
    </header>

    <!-- Filter Pills -->
    <div class="filter-scroll">
        <div class="filter-pill active">ALL</div>
        <div class="filter-pill">ACTIVE</div>
        <div class="filter-pill">PENDING</div>
        <div class="filter-pill">WATCH</div>
    </div>

    <!-- Signal Cards -->
    <main class="card-container" id="signalGrid">
        <div class="loading">
            <div class="spinner"></div>
            <div style="font-size: 13px;">Scanning 15 markets with 6 AI strategies...</div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-btn active"><div class="nav-icon">📊</div><div>Dashboard</div></div>
        <div class="nav-btn"><div class="nav-icon">🎯</div><div>Signals</div></div>
        <div class="nav-btn"><div class="nav-icon">📓</div><div>Journal</div></div>
        <div class="nav-btn"><div class="nav-icon">⚙️</div><div>Settings</div></div>
    </nav>

    <script>
        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
            document.getElementById('dateLabel').innerText = now.toDateString().toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fetch Data
        async function fetchSignals() {
            try {
                // ⚠️ REPLACE WITH YOUR ACTUAL RENDER URL ⚠️
                const res = await fetch('https://fx-app-2.onrender.com/signals');
                const signals = await res.json();
                renderSignals(signals);
            } catch (e) {
                document.getElementById('signalGrid').innerHTML = `
                    <div class="empty-state"><div class="empty-icon">⚠️</div><div>Backend Disconnected</div></div>`;
            }
        }

        function renderSignals(signals) {
            const grid = document.getElementById('signalGrid');
            let pairCount = 0;

            if (!signals || signals.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <div style="font-weight: 700; color: var(--text-main); margin-bottom: 5px;">No Active Pairs</div>
                        <div style="font-size: 12px;">AI is scanning markets. Setups will appear here automatically.</div>
                    </div>`;
                document.getElementById('totalSignals').innerText = '0 PAIRS';
                return;
            }

            let html = '';
            let globalSetupIndex = 0;

            // Group by Pair
            signals.forEach(s => {
                pairCount++;
                
                html += `
                    <div class="pair-card">
                        <div class="card-header">
                            <div class="pair-name">${s.pair}</div>
                            <div class="setups-count">${s.setups.length} SETUP${s.setups.length > 1 ? 'S' : ''}</div>
                        </div>
                `;

                // List each setup inside the single card
                s.setups.forEach(setup => {
                    const isBuy = setup.direction === 'BUY';
                    // Use ACTIVE for the first setup, PENDING for others to show priority
                    const status = globalSetupIndex === 0 ? 'active' : 'pending'; 
                    const statusText = status === 'active' ? 'ACTIVE' : 'PENDING';
                    const uniqueId = `setup-${globalSetupIndex}`;

                    html += `
                        <div class="setup-block" id="block-${uniqueId}">
                            <div class="setup-top">
                                <div style="display:flex; gap:6px;">
                                    <span class="tf-badge">${setup.timeframe}</span>
                                    <span class="dir-badge ${isBuy ? 'buy' : 'sell'}">${setup.direction}</span>
                                </div>
                                <span class="status-badge ${status}">● ${statusText}</span>
                            </div>
                            
                            <div class="strat-text">${setup.strategy_name}</div>
                            
                            <div class="price-grid">
                                <div class="price-cell">
                                    <div class="price-label">ENTRY</div>
                                    <div class="price-val entry">${setup.entry}</div>
                                </div>
                                <div class="price-cell">
                                    <div class="price-label">STOP</div>
                                    <div class="price-val stop">${setup.stopLoss}</div>
                                </div>
                                <div class="price-cell">
                                    <div class="price-label">TP1</div>
                                    <div class="price-val tp">${setup.takeProfit}</div>
                                </div>
                            </div>
                            
                            <div class="timer-section">
                                <div class="timer-track"><div class="timer-fill" id="fill-${uniqueId}" style="width: 100%"></div></div>
                                <div class="timer-text" id="time-${uniqueId}">30:00</div>
                            </div>
                        </div>
                    `;
                    globalSetupIndex++;
                });

                html += `</div>`; // Close pair-card
            });

            grid.innerHTML = html;
            document.getElementById('totalSignals').innerText = `${pairCount} PAIRS`;
            startTimers(globalSetupIndex);
        }

        function startTimers(totalSetups) {
            for (let i = 0; i < totalSetups; i++) {
                const id = `setup-${i}`;
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + 30);
                
                const interval = setInterval(() => {
                    const now = new Date();
                    const diff = expiresAt - now;
                    
                    if (diff <= 0) {
                        clearInterval(interval);
                        const block = document.getElementById(`block-${id}`);
                        if (block) block.style.opacity = '0.4';
                        document.getElementById(`time-${id}`).innerText = "EXPIRED";
                        document.getElementById(`fill-${id}`).style.width = "0%";
                        return;
                    }
                    
                    const mins = Math.floor(diff / 60000);
                    const secs = Math.floor((diff % 60000) / 1000);
                    document.getElementById(`time-${id}`).innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                    document.getElementById(`fill-${id}`).style.width = `${(diff / 1800000) * 100}%`;
                }, 1000);
            }
        }

        fetchSignals();
        setInterval(fetchSignals, 60000);
    </script>
</body>
</html>
