<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding-bottom: 20px; }
        
        .header { background: #141414; padding: 20px; text-align: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #FFD700; }
        
        .status-bar { background: rgba(0, 200, 83, 0.1); border: 1px solid rgba(0, 200, 83, 0.3); padding: 10px; text-align: center; color: #00C853; font-size: 13px; margin: 15px; border-radius: 8px; }
        
        .card { background: #141414; border: 1px solid #333; border-radius: 12px; margin: 15px; padding: 15px; }
        .pair-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #222; }
        .pair-name { font-size: 22px; font-weight: 900; color: #FFD700; }
        
        /* Individual Setup Block */
        .setup-block { background: #0a0a0a; border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #222; }
        .setup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tf-badge { background: #222; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; }
        .dir-badge { padding: 4px 10px; border-radius: 4px; font-weight: 800; font-size: 12px; }
        .buy { background: #00C853; color: #000; }
        .sell { background: #FF1744; color: #fff; }
        
        .prices { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .price-col { text-align: center; flex: 1; }
        .price-label { font-size: 9px; color: #666; text-transform: uppercase; margin-bottom: 2px; }
        .price-val { font-size: 13px; font-weight: 700; }
        
        .timer-container { display: flex; align-items: center; gap: 10px; }
        .timer-bar { flex: 1; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        .timer-fill { height: 100%; background: #FFD700; width: 100%; transition: width 1s linear; }
        .timer-text { font-size: 11px; color: #888; font-weight: 700; min-width: 40px; text-align: right; }
        
        .tv-btn { display: block; width: 100%; background: #1DA1F2; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; margin-top: 10px; }
        
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="header"><div class="logo">FX PRO</div></div>
    <div id="status" class="status-bar">⏳ Scanning 15 Markets...</div>
    <div id="container"><div class="loading">Loading AI Engine...</div></div>

    <script>
        const tvMap = {
            'XAUUSD': 'OANDA:XAUUSD', 'EURUSD': 'OANDA:EURUSD', 'GBPUSD': 'OANDA:GBPUSD',
            'USDJPY': 'OANDA:USDJPY', 'BTCUSD': 'BINANCE:BTCUSDT', 'NAS100': 'NASDAQ:NDX',
            'US30': 'DJ:DJI', 'USOIL': 'TVC:USOIL'
        };

        async function fetchSignals() {
            try {
                // ⚠️ REPLACE WITH YOUR ACTUAL RENDER URL
                const res = await fetch('https://fx-app-2.onrender.com/signals'); 
                const signals = await res.json();
                renderSignals(signals);
            } catch (e) {
                document.getElementById('status').innerHTML = '❌ Backend Disconnected';
            }
        }

        function renderSignals(signals) {
            const container = document.getElementById('container');
            const status = document.getElementById('status');
            
            if (!signals || signals.length === 0) {
                status.innerHTML = '⏳ No high-confluence setups right now.';
                container.innerHTML = '<div class="loading">AI is scanning 15 markets across M15, H1, H4...</div>';
                return;
            }
            
            status.innerHTML = `✅ ${signals.length} Active Pairs Found`;
            let html = '';
            let setupCounter = 0;
            
            signals.forEach(s => {
                html += `<div class="card"><div class="pair-header"><div class="pair-name">${s.pair}</div></div>`;
                
                s.setups.forEach(setup => {
                    const isBuy = setup.direction === 'BUY';
                    const tvSymbol = tvMap[s.pair] || s.pair;
                    const uniqueId = `setup-${setupCounter}`;
                    
                    html += `
                        <div class="setup-block" id="block-${uniqueId}">
                            <div class="setup-header">
                                <div class="tf-badge">${setup.timeframe}</div>
                                <div class="dir-badge ${isBuy ? 'buy' : 'sell'}">${setup.direction}</div>
                            </div>
                            
                            <div class="prices">
                                <div class="price-col"><div class="price-label">Entry</div><div class="price-val" style="color:#FFD700">${setup.entry}</div></div>
                                <div class="price-col"><div class="price-label">Stop Loss</div><div class="price-val" style="color:#FF1744">${setup.stopLoss}</div></div>
                                <div class="price-col"><div class="price-label">Take Profit</div><div class="price-val" style="color:#00C853">${setup.takeProfit}</div></div>
                            </div>
                            
                            <div class="timer-container">
                                <div class="timer-bar"><div class="timer-fill" id="fill-${uniqueId}"></div></div>
                                <div class="timer-text" id="time-${uniqueId}">15:00</div>
                            </div>
                            
                            <a href="https://www.tradingview.com/chart/?symbol=${tvSymbol}" target="_blank" class="tv-btn">📊 View Live Chart</a>
                        </div>
                    `;
                    setupCounter++;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
            startTimers(setupCounter);
        }

        function startTimers(totalSetups) {
            for (let i = 0; i < totalSetups; i++) {
                const id = `setup-${i}`;
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + 15); // 15 min timer
                
                const interval = setInterval(() => {
                    const now = new Date();
                    const diff = expiresAt - now;
                    
                    if (diff <= 0) {
                        clearInterval(interval);
                        const block = document.getElementById(`block-${id}`);
                        if (block) block.style.opacity = '0.3';
                        document.getElementById(`time-${id}`).innerText = "EXPIRED";
                        document.getElementById(`fill-${id}`).style.width = "0%";
                        return;
                    }
                    
                    const mins = Math.floor(diff / 60000);
                    const secs = Math.floor((diff % 60000) / 1000);
                    document.getElementById(`time-${id}`).innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
                    document.getElementById(`fill-${id}`).style.width = `${(diff / 900000) * 100}%`;
                }, 1000);
            }
        }

        fetchSignals();
        setInterval(fetchSignals, 60000); 
    </script>
</body>
</html>
